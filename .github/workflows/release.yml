# Release pipeline of the standalone agent.
#
# Produces, for every tag, the three things needed to check that a binary you
# are running came from this source:
#
#   1. the binaries themselves, built on a clean runner;
#   2. SHA256SUMS, so you have a canonical list to compare against;
#   3. a signed provenance attestation binding each digest to this repository,
#      this commit and this workflow — which holds even where a bit-for-bit
#      rebuild is not possible.
#
# Reproducibility, measured rather than assumed: `bun build --compile` is
# deterministic and independent of the checkout path, and two independent runs
# of this workflow produce identical digests. It is *not* stable across builder
# platforms — the same source compiled on Windows and on Linux yields different
# bytes. So the guarantee is: rebuild on Linux x64 with the pinned Bun version
# and you get these exact hashes.
name: Release

on:
  push:
    tags: ['v*', 'agent-v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify before releasing
        run: |
          bun run typecheck
          bun run protocol:check

      - name: Build every target
        run: bun run build

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum servor-agent-* > SHA256SUMS
          cat SHA256SUMS

      # Cryptographic provenance: ties each digest to this repo, commit and
      # workflow. Verify with:
      #   gh attestation verify <binary> --repo benode-SAS/servor-agent
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/servor-agent-*'

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/servor-agent-*
            dist/SHA256SUMS
          body: |
            Built from this tag on a clean runner.

            **Check what you are running**

            ```sh
            sha256sum servor-agent-linux-x64          # compare with SHA256SUMS
            gh attestation verify servor-agent-linux-x64 --repo benode-SAS/servor-agent
            ```

            **Rebuild it yourself** — on Linux x64, with Bun 1.3.14:

            ```sh
            bun install --frozen-lockfile && bun run build
            sha256sum dist/servor-agent-linux-x64
            ```

            The digest will match. On another builder platform it will not:
            `bun --compile` is deterministic per platform, not across them.
          generate_release_notes: true
