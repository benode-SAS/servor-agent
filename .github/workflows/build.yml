# CI of the standalone agent repository.
#
# This file is inert inside the Servor monorepo — GitHub only reads workflows at
# a repository root — and becomes the pipeline of the public mirror, where
# apps/agent *is* the root.
#
# Its job is to make the claim checkable: every target is compiled from this
# source on a clean runner, and each binary's SHA-256 is printed in the log so
# anyone can compare it against the agent they are running.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Vendored protocol copies
        run: bun run protocol:check
      # Inside `verify` rather than as a job of its own: `verify` is already a
      # required check on main, so the tests gate merges without anyone having
      # to remember to add a second one to the ruleset.
      - name: Unit tests
        run: bun test

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - linux-arm64
          - linux-x64-musl
          - linux-arm64-musl
          - darwin-x64
          - darwin-arm64
          - windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Compile ${{ matrix.target }}
        run: bun run build:${{ matrix.target }}

      # Printed rather than hidden: this is the number to compare against the
      # binary running on your server.
      - name: Checksum
        run: |
          cd dist
          sha256sum * | tee "../checksums-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: servor-agent-${{ matrix.target }}
          path: |
            dist/*
            checksums-${{ matrix.target }}.txt
          retention-days: 14
